name: Apple CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The app uses iOS 27 APIs (iPhone Duo): it needs the newest Xcode on the runner, not the image default.
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # A generic destination needs no particular simulator model to be installed.
      - name: Build iOS app
        run: |
          xcodebuild build -project IPv64.xcodeproj -scheme IPv64.net \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO
      - name: Build Apple TV app
        run: |
          xcodebuild build -project IPv64.xcodeproj -scheme IPv64TV \
            -destination "generic/platform=tvOS Simulator" CODE_SIGNING_ALLOWED=NO
